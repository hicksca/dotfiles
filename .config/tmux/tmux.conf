# Clear space for preferred bindings
unbind n     # next window
unbind w     # choose window interactively
unbind %     # split vertically
unbind '"'   # split horizontally

# Larger scrollback history
set -g history-limit 100000

# Mouse support (helpful on a laptop)
set -g mouse on

# Start window and pane numbering at 1 rather than 0
set -g base-index 1
setw -g pane-base-index 1

# Split panes with | and -, keeping the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Window management: n renames, w opens a new window in the current directory
bind n command-prompt "rename-window '%%'"
bind w new-window -c "#{pane_current_path}"
